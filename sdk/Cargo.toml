[package]
name = "sync-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
description = "Rust client SDK for the syncserver photo synchronization protocol"
publish = false

[lib]
name = "sync_client"
path = "src/lib.rs"

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["fs", "io-util", "rt", "sync", "time"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
axum = "0.8"
tempfile = "3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread"] }
